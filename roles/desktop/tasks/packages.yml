---
- name: 'Remove power-profiles-daemon before installing TLP'
  ansible.builtin.apt:
    name: 'power-profiles-daemon'
    state: 'absent'

- name: 'Install the minimal graphical desktop'
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
    policy_rc_d: 101
    state: 'present'
    name:
      - 'acl'
      - 'adwaita-icon-theme'
      - 'alsa-utils'
      - 'audacity'
      - 'bluez'
      - 'blueman'
      - 'brightnessctl'
      - 'brightness-udev'
      - 'chromium'
      - 'cups'
      - 'cups-pk-helper'
      - 'dbus-user-session'
      - 'dconf-cli'
      - 'dunst'
      - 'eom'
      - 'ffmpegthumbnailer'
      - 'file-roller'
      - 'firmware-amd-graphics'
      - 'fonts-dejavu-core'
      - 'fonts-noto-color-emoji'
      - 'fwupd'
      - 'gnome-themes-extra'
      - 'greetd'
      - 'grim'
      - 'gir1.2-gtk-3.0'
      - 'gir1.2-gtklayershell-0.1'
      - 'gedit'
      - 'gimp'
      - 'gir1.2-ayatanaappindicator3-0.1'
      - 'gstreamer1.0-libav'
      - 'gstreamer1.0-plugins-good'
      - 'gvfs'
      - 'gvfs-backends'
      - 'gvfs-fuse'
      - 'heif-gdk-pixbuf'
      - 'keepassxc'
      - 'kdeconnect'
      - 'libgdk-pixbuf2.0-bin'
      - 'libglib2.0-bin'
      - 'libjxl-gdk-pixbuf'
      - 'libgl1-mesa-dri'
      - 'libglx-mesa0'
      - 'libpam-systemd'
      - 'libnotify-bin'
      - 'libnss3-tools'
      - 'libspa-0.2-bluetooth'
      - 'lm-sensors'
      - 'locales'
      - 'mate-polkit'
      - 'mesa-utils'
      - 'mesa-va-drivers'
      - 'mesa-vdpau-drivers'
      - 'mesa-vulkan-drivers'
      - 'mpv'
      - 'mupdf'
      - 'nemo'
      - 'nemo-fileroller'
      - 'network-manager-applet'
      - 'nm-connection-editor'
      - 'papirus-icon-theme'
      - 'pavucontrol'
      - 'pipewire'
      - 'pipewire-alsa'
      - 'pipewire-pulse'
      - 'playerctl'
      - 'polkitd'
      - 'poppler-utils'
      - 'powertop'
      - 'python3-gi'
      - 'python3-psutil'
      - 'qt6-wayland'
      - 'qtwayland5'
      - 'radeontop'
      - 'slurp'
      - 'swaylock'
      - 'syncthing'
      - 'system-config-printer'
      - 'tlp'
      - 'tlp-pd'
      - 'tlp-rdw'
      - 'thunderbird'
      - 'thunderbird-l10n-fr'
      - 'tumbler'
      - 'udiskie'
      - 'udisks2'
      - 'upower'
      - 'vlc'
      - 'vulkan-tools'
      - 'wl-clipboard'
      - 'wireguard-tools'
      - 'wireplumber'
      - 'wtype'
      - 'xdg-desktop-portal'
      - 'xdg-desktop-portal-gtk'
      - 'xdg-desktop-portal-wlr'
      - 'xdg-user-dirs'
      - 'xdg-utils'
      - 'xwayland'

- name: 'Enable TLP power management'
  ansible.builtin.systemd_service:
    name: 'tlp.service'
    enabled: true
    state: 'started'

- name: 'Install SwayFX, SceneFX and wlroots build dependencies'
  ansible.builtin.apt:
    install_recommends: false
    state: 'present'
    name:
      - 'build-essential'
      - 'ca-certificates'
      - 'cmake'
      - 'git'
      - 'hwdata'
      - 'libcairo2-dev'
      - 'libdisplay-info-dev'
      - 'libdrm-dev'
      - 'libegl-dev'
      - 'libevdev-dev'
      - 'libgbm-dev'
      - 'libgdk-pixbuf-2.0-dev'
      - 'libgles-dev'
      - 'libinput-dev'
      - 'libjson-c-dev'
      - 'liblcms2-dev'
      - 'libliftoff-dev'
      - 'libpango1.0-dev'
      - 'libpcre2-dev'
      - 'libpixman-1-dev'
      - 'libseat-dev'
      - 'libudev-dev'
      - 'libwayland-dev'
      - 'libxcb-composite0-dev'
      - 'libxcb-dri3-dev'
      - 'libxcb-ewmh-dev'
      - 'libxcb-icccm4-dev'
      - 'libxcb-present-dev'
      - 'libxcb-render-util0-dev'
      - 'libxcb-res0-dev'
      - 'libxcb-xfixes0-dev'
      - 'libxcb-xinput-dev'
      - 'libxkbcommon-dev'
      - 'meson'
      - 'ninja-build'
      - 'pkgconf'
      - 'scdoc'
      - 'wayland-protocols'
