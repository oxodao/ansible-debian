---
firefox_policies:
  RequestedLocales: ['fr']
  DisableTelemetry: true
  DisableFirefoxStudies: true
  DisableProfileImport: true
  DontCheckDefaultBrowser: true
  OverrideFirstRunPage: ''
  OverridePostUpdatePage: ''
  Certificates:
    Install:
      - '/usr/local/share/ca-certificates/oxlabs-root.crt'
  AIControls:
    SidebarChatbot:
      Value: 'blocked'
      Locked: false
    Translations:
      Value: 'available'
      Locked: false

firefox_extensions:
  'extension@tabliss.io':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/tabliss/latest.xpi'
    private_browsing: true
  'sponsorBlocker@ajay.app':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/sponsorblock/latest.xpi'
    private_browsing: true
  '{aecec67f-0d10-4fa7-b7c7-609a2db280cf}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/violentmonkey/latest.xpi'
    private_browsing: true
  'uBlock0@raymondhill.net':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi'
    private_browsing: true
  '{446900e4-71c2-419f-a6a7-df9c091e268b}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/bitwarden-password-manager/latest.xpi'
    private_browsing: true
  '{7a7a4a92-a2a0-41d1-9fd7-1e92480d612d}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/styl-us/latest.xpi'
    private_browsing: true
  '{531906d3-e22f-4a6c-a102-8057b88a1a63}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/single-file/latest.xpi'
    private_browsing: true
  '{74145f27-f039-47ce-a470-a662b129930a}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/clearurls/latest.xpi'
    private_browsing: true
  '{7d275064-ec2e-4a96-b0cf-a774c506d22d}':
    installation_mode: 'normal_installed'
    install_url: 'https://addons.mozilla.org/firefox/downloads/latest/synthwave-84/latest.xpi'

firefox_preferences:
  browser.aboutwelcome.enabled: {Value: false, Status: 'default'}
  browser.compactmode.show: {Value: true, Status: 'default'}
  browser.toolbars.bookmarks.visibility: {Value: 'always', Status: 'default'}
  browser.download.autohideButton: {Value: false, Status: 'default'}
  browser.fixup.domainsuffixwhitelist.lan: {Value: true, Status: 'default'}
  browser.fullscreen.autohide: {Value: false, Status: 'default'}
  browser.translations.neverTranslateLanguages: {Value: 'en', Status: 'default'}
  browser.uidensity: {Value: 1, Status: 'default', Type: 'number'}
  browser.urlbar.suggest.quicksuggest.all: {Value: true, Status: 'default'}
  browser.urlbar.suggest.quicksuggest.sponsored: {Value: false, Status: 'default'}
  extensions.formautofill.creditCards.enabled: {Value: false, Status: 'default'}
  intl.accept_languages: {Value: 'fr-FR, fr, en-US, en', Status: 'default'}
  intl.locale.requested: {Value: 'fr', Status: 'default'}

# Préférences non acceptées par la policy Preferences de Firefox.
firefox_autoconfig_preferences:
  findbar.highlightAll: {Value: true, Status: 'default'}
